name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Prepare Node application
        run: cp package.json package-lock.json dist/

      - name: Install deployment clients
        run: sudo apt-get update && sudo apt-get install --yes lftp sshpass

      - name: Deploy to Hetzner
        env:
          SFTP_HOST: ${{ secrets.HETZNER_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.HETZNER_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.HETZNER_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.HETZNER_SFTP_PASSWORD }}
          SFTP_DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
        run: |
          : "${SFTP_HOST:?Missing HETZNER_SFTP_HOST secret}"
          : "${SFTP_PORT:?Missing HETZNER_SFTP_PORT secret}"
          : "${SFTP_USERNAME:?Missing HETZNER_SFTP_USERNAME secret}"
          : "${SFTP_PASSWORD:?Missing HETZNER_SFTP_PASSWORD secret}"
          : "${SFTP_DEPLOY_PATH:?Missing HETZNER_DEPLOY_PATH secret}"
          lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --parallel=4 --exclude-glob node_modules/ --exclude-glob .env* --verbose dist/ "$SFTP_DEPLOY_PATH"
          bye
          EOF

      - name: Install production dependencies and restart
        env:
          SSHPASS: ${{ secrets.HETZNER_SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.HETZNER_SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.HETZNER_SFTP_USERNAME }}
          SFTP_DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
        run: |
          # ssh joins the remote command into one string, so the path is quoted and embedded directly
          remote_path="$(printf '%q' "${SFTP_DEPLOY_PATH#/}")"
          sshpass -e ssh -p 222 -o StrictHostKeyChecking=accept-new \
            "$SFTP_USERNAME@$SFTP_HOST" \
            "cd \"\$HOME\"/$remote_path && echo 22 > \"\$HOME/.nodeversion\" && npm ci --omit=dev && (pkill -f '[s]erver/entry.mjs' || true)"

      - name: Smoke test
        run: curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --output /dev/null https://lootuskollektiv.de/
