name: Deploy WordPress Theme and Config

on:
  push:
    branches: [main]
    paths:
      - wordpress/themes/lootus/**
      - wordpress/mu-plugins/**
      - wordpress/.wp-env.json
      - .github/workflows/deploy-wordpress.yml

permissions:
  contents: read

concurrency:
  group: production-wordpress-theme-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deployment client
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install --yes lftp

      - name: Deploy theme to Hetzner
        env:
          SFTP_HOST: ${{ secrets.HETZNER_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.HETZNER_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.HETZNER_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.HETZNER_SFTP_PASSWORD }}
        run: |
          : "${SFTP_HOST:?Missing HETZNER_SFTP_HOST secret}"
          : "${SFTP_PORT:?Missing HETZNER_SFTP_PORT secret}"
          : "${SFTP_USERNAME:?Missing HETZNER_SFTP_USERNAME secret}"
          : "${SFTP_PASSWORD:?Missing HETZNER_SFTP_PASSWORD secret}"
          lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --parallel=4 --verbose wordpress/themes/lootus/ /public_html/shop/wp-content/themes/lootus/
          mkdir -p /public_html/shop/wp-content/mu-plugins
          put wordpress/mu-plugins/lootus-wp-config.php -o /public_html/shop/wp-content/mu-plugins/lootus-wp-config.php
          bye
          EOF
